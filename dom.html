<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<link
			rel="stylesheet"
			href="style.css" />

		<title>Konversi Suhu</title>
	</head>
	<body>
		<form id="converter">
			<div class="form-convert">
				<h1>Program Konversi Suhu</h1>
				<label for="celsius">Masukan suhu dalam Celcius</label>
				<input
					type="number"
					id="celcius"
					name="celcius" />
				<button
					type="submit"
					name="submit"
					value="Submit">
					Konversi
				</button>
				<div>
					<p id="fahrenheit">Hasil</p>
				</div>
			</div>
		</form>

		<table>
			<thead>
				<tr>
					<th>Celcius</th>
					<th>Fahrenheit</th>
					<th>Hasil</th>
				</tr>
			</thead>
			<tbody id="table-body"></tbody>
		</table>

		<script src="app.js"></script>
	</body>
</html>
